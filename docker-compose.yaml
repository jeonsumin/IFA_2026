services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: always

    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - ifa-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  ifa-data:

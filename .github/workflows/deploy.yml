name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push images to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          WEB=$REGISTRY/$OWNER_LC/ifa-web
          API=$REGISTRY/$OWNER_LC/ifa-api
          docker build -t $WEB:$TAG -t $WEB:latest ./frontend
          docker build -t $API:$TAG -t $API:latest ./backend
          docker push $WEB:$TAG
          docker push $WEB:latest
          docker push $API:$TAG
          docker push $API:latest
